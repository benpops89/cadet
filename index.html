<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React</title>

    <!-- Inline so it renders before JS/CSS bundles load -->
    <style>
      body {
        margin: 0;
        background: #0b0b0b;
      }

      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0b;
        z-index: 9999;
      }

      .app-loading__spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: rgba(255, 255, 255, 0.9);
        border-radius: 9999px;
        animation: app-loading-spin 0.9s linear infinite;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading__spinner {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app-loading" class="app-loading" aria-label="Loading" role="status">
      <div class="app-loading__spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
